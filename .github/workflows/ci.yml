name: Website CI — Build & Content Check

# ZMIANA (16.08, Daniel: mail od GitHuba "uzylismy 90% minut Actions" -
# 1801/2000 w cyklu, wspolny limit dla calej organizacji investrentkg,
# wiec ten plik TEZ sie do tego przyczynial). Uruchamial sie
# AUTOMATYCZNIE przy kazdym pushu dotykajacym src/**, i mial krok
# "sleep 300" - 5 MINUT czystego czekania - przed sprawdzeniem tresci
# strony. Railway i tak sam pilnuje swoich deployow. Teraz TYLKO na
# zadanie - job "content-check" (ktory wymagal tego sleep, zeby dac
# Railway czas na przebudowanie) rowniez usuniety, bo sprawdza stan
# strony NA ZYWO w danym momencie, nie po konkretnym pushu - lepiej
# sprawdzic to recznie w przegladarce po deployu niz czekac 5 minut w CI.
on:
  workflow_dispatch:

jobs:
  build-check:
    name: Sprawdź build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        # Next.js nie failuje na TS errors podczas build ale dobrze wiedzieć

      - name: Next.js build test
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://investrent-crm-production.up.railway.app

      - name: ✅ Build OK
        run: echo "Build zakończony pomyślnie"
